<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VOIDPULSE — Mobile</title>
<style>
  :root { --acc:#00e5ff; --acc-dim:rgba(0,229,255,.35); --bg:#05070c; --panel:rgba(10,15,22,.78); --txt:#dff6ff; --danger:#ff4d7e; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:var(--bg); overscroll-behavior:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--txt);
    touch-action:none; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; }
  [hidden] { display:none !important; }

  /* ---------- shared glass ---------- */
  .glass { background:var(--panel); border:1px solid var(--acc-dim); border-radius:14px;
    backdrop-filter:blur(16px) saturate(1.35); -webkit-backdrop-filter:blur(16px) saturate(1.35);
    box-shadow:0 0 24px rgba(0,229,255,.10), inset 0 0 18px rgba(0,229,255,.05); }
  .btn { display:flex; align-items:center; justify-content:center; min-height:48px; min-width:48px;
    padding:12px 22px; border:1px solid var(--acc-dim); border-radius:12px; background:rgba(0,229,255,.07);
    color:var(--txt); font:inherit; font-size:14px; letter-spacing:.18em; text-transform:uppercase;
    transition:transform .06s ease, background .12s ease, box-shadow .12s ease; }
  .btn:active { transform:scale(.96); background:rgba(0,229,255,.2); box-shadow:0 0 18px var(--acc-dim); }
  .btn.primary { background:rgba(0,229,255,.16); border-color:var(--acc); box-shadow:0 0 20px rgba(0,229,255,.25); font-weight:700; }
  .btn.danger { border-color:rgba(255,77,126,.5); background:rgba(255,77,126,.08); }
  .seg { display:flex; gap:8px; width:100%; }
  .seg .btn { flex:1; padding:10px 6px; min-width:48px; font-size:12px; }
  .seg .btn.on { background:rgba(0,229,255,.22); border-color:var(--acc); box-shadow:0 0 14px var(--acc-dim); }

  .screen { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px)
    calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 18px); }
  .dim { background:rgba(4,6,11,.62); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }

  /* ---------- title ---------- */
  #screen-title .logo { font-size:clamp(34px,9vw,58px); font-weight:800; letter-spacing:.30em; margin-left:.30em;
    color:#eafcff; text-shadow:0 0 18px var(--acc), 0 0 60px rgba(0,229,255,.45); animation:pulse 2.6s ease-in-out infinite; }
  #screen-title .sub { letter-spacing:.6em; margin-left:.6em; font-size:12px; color:var(--acc); opacity:.85; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.82 } }
  .hint { font-size:11px; letter-spacing:.14em; opacity:.55; text-align:center; line-height:1.7; }

  /* ---------- HUD DOM bits ---------- */
  #btn-pause { position:fixed; z-index:20; top:calc(env(safe-area-inset-top) + 8px);
    right:calc(env(safe-area-inset-right) + 8px); width:48px; height:48px; padding:0; border-radius:10px; }

  /* ---------- perk modal ---------- */
  #modal-perk { z-index:40; }
  #perk-title { font-size:15px; letter-spacing:.34em; color:var(--acc); }
  #perk-cards { display:flex; gap:12px; width:100%; max-width:640px; justify-content:center; }
  .perk-card { flex:1; max-width:200px; min-height:128px; padding:14px 10px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; text-align:center; border-radius:14px;
    background:var(--panel); border:1px solid var(--acc-dim); color:var(--txt); font:inherit;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); transition:transform .07s ease, box-shadow .12s ease, border-color .12s; }
  .perk-card .pname { font-size:13px; font-weight:700; letter-spacing:.12em; color:var(--acc); }
  .perk-card .pdesc { font-size:11px; opacity:.8; line-height:1.55; }
  .perk-card:active { transform:scale(.95); border-color:var(--acc); box-shadow:0 0 26px var(--acc-dim); }

  /* ---------- pause / settings drawer ---------- */
  #drawer-pause { z-index:50; justify-content:flex-end; }
  #drawer-pause .panel { width:min(430px, 94vw); max-height:calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 24px);
    overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:13px; touch-action:pan-y; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12px; letter-spacing:.1em; }
  .row label { opacity:.8; }
  input[type=range] { flex:1; max-width:190px; height:48px; accent-color:var(--acc); touch-action:none; }
  .switch { width:52px; height:30px; border-radius:15px; border:1px solid var(--acc-dim); background:rgba(0,229,255,.06);
    position:relative; transition:background .15s; flex:0 0 52px; }
  .switch.on { background:rgba(0,229,255,.30); }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
    background:var(--txt); transition:left .15s; }
  .switch.on::after { left:25px; }

  /* ---------- garage ---------- */
  #screen-garage { z-index:45; gap:10px; }
  #garage-head { display:flex; align-items:center; gap:14px; width:100%; max-width:760px; }
  #garage-head .btn { min-width:64px; padding:10px 14px; }
  #garage-cores { margin-left:auto; font-size:13px; letter-spacing:.16em; color:#ffe066; }
  #garage-track { display:flex; gap:14px; width:100%; max-width:760px; overflow-x:auto; scroll-snap-type:x mandatory;
    padding:8px 4px 14px; touch-action:pan-x; }
  .gcard { flex:0 0 236px; scroll-snap-align:center; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .gcard h3 { font-size:15px; letter-spacing:.22em; color:var(--acc); display:flex; justify-content:space-between; }
  .gcard .tag { font-size:10px; opacity:.55; letter-spacing:.1em; }
  .stat { display:flex; align-items:center; gap:8px; font-size:10px; letter-spacing:.12em; opacity:.85; }
  .stat b { width:52px; font-weight:400; opacity:.7; }
  .bar { flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--acc); box-shadow:0 0 8px var(--acc-dim); }
  .gcard .btn { margin-top:4px; }
  .gcard.locked { opacity:.62; }

  /* ---------- game over ---------- */
  #screen-gameover { z-index:45; }
  #go-title { font-size:clamp(26px,7vw,44px); font-weight:800; letter-spacing:.26em; margin-left:.26em; }
  #go-title.win { color:#7dffd4; text-shadow:0 0 22px rgba(125,255,212,.6); }
  #go-title.lose { color:#ff4d7e; text-shadow:0 0 22px rgba(255,77,126,.5); }
  #go-newbest { font-size:12px; letter-spacing:.3em; color:#ffe066; }
  #go-stats { display:grid; grid-template-columns:repeat(2,minmax(130px,1fr)); gap:10px; width:100%; max-width:480px; padding:14px; }
  #go-stats .cell { padding:12px 8px; text-align:center; }
  #go-stats .cell b { display:block; font-size:20px; font-weight:700; color:#eafcff; }
  #go-stats .cell span { font-size:10px; letter-spacing:.2em; opacity:.6; }
  .btnrow { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  #dbg { position:fixed; z-index:60; left:calc(env(safe-area-inset-left) + 8px); bottom:calc(env(safe-area-inset-bottom) + 10px);
    font-size:10px; opacity:.7; color:#7dffd4; pointer-events:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- safe-area probe (read by JS to mirror insets onto the canvas HUD) -->
<div id="safe-probe" style="position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>

<button id="btn-pause" class="btn glass" hidden aria-label="Pause">II</button>

<!-- TITLE -->
<section id="screen-title" class="screen dim">
  <div class="logo">VOIDPULSE</div>
  <div class="sub">MOBILE</div>
  <div style="height:8px"></div>
  <button id="btn-start" class="btn primary" style="min-width:230px">▶ Start Run</button>
  <div class="btnrow">
    <button id="btn-garage" class="btn">Garage</button>
    <button id="btn-settings-title" class="btn">Settings</button>
  </div>
  <div id="title-bests" class="hint"></div>
  <div id="title-ver" class="hint">v1.5.0 — zero-alloc touch engine</div>
</section>

<!-- GARAGE -->
<section id="screen-garage" class="screen dim" hidden>
  <div id="garage-head">
    <button id="btn-garage-back" class="btn">‹ Back</button>
    <div style="font-size:14px;letter-spacing:.3em;color:var(--acc)">GARAGE</div>
    <div id="garage-cores">◆ 0</div>
  </div>
  <div id="garage-track"></div>
  <div class="hint">SWIPE TO BROWSE HULLS · CORES BANKED FROM EVERY RUN</div>
</section>

<!-- PERK MODAL -->
<section id="modal-perk" class="screen dim" hidden>
  <div id="perk-title">◆ LEVEL UP</div>
  <div id="perk-cards"></div>
  <div class="hint">TAP A MODULE TO INSTALL</div>
</section>

<!-- PAUSE / SETTINGS DRAWER -->
<section id="drawer-pause" class="screen" hidden>
  <div class="panel glass">
    <div class="row" style="justify-content:center;font-size:13px;letter-spacing:.3em;color:var(--acc)">PAUSED</div>
    <div class="row"><label>MASTER</label><input id="rng-master" type="range" min="0" max="100" value="80"></div>
    <div class="row"><label>SFX</label><input id="rng-sfx" type="range" min="0" max="100" value="80"></div>
    <div class="row"><label>MUSIC</label><input id="rng-music" type="range" min="0" max="100" value="45"></div>
    <div class="row"><label>HAPTICS</label><button id="tgl-haptics" class="switch on" aria-label="Haptics toggle"></button></div>
    <div class="row"><label>COLOR VISION</label></div>
    <div class="seg" id="seg-palette">
      <button class="btn on" data-pal="0">DEFAULT</button><button class="btn" data-pal="1">DEUTAN</button>
      <button class="btn" data-pal="2">PROTAN</button><button class="btn" data-pal="3">TRITAN</button>
    </div>
    <div class="row"><label>FRAME RATE</label></div>
    <div class="seg" id="seg-fps">
      <button class="btn on" data-fps="0">60 LOW-POWER</button><button class="btn" data-fps="1">120</button>
    </div>
    <button id="btn-resume" class="btn primary">Resume</button>
    <button id="btn-abandon" class="btn danger">Abandon Run</button>
  </div>
</section>

<!-- GAME OVER / VICTORY -->
<section id="screen-gameover" class="screen dim" hidden>
  <div id="go-title" class="lose">GAME OVER</div>
  <div id="go-newbest" hidden>★ NEW BEST ★</div>
  <div id="go-stats" class="glass">
    <div class="cell"><b id="go-score">0</b><span>SCORE</span></div>
    <div class="cell"><b id="go-wave">0</b><span>WAVE</span></div>
    <div class="cell"><b id="go-kills">0</b><span>KILLS</span></div>
    <div class="cell"><b id="go-time">0:00</b><span>TIME</span></div>
  </div>
  <div id="go-cores" class="hint" style="color:#ffe066;font-size:13px">◆ +0 CORES BANKED</div>
  <button id="btn-restart" class="btn primary" style="min-width:240px">↻ Restart Run</button>
  <div class="btnrow">
    <button id="btn-go-garage" class="btn">Garage</button>
    <button id="btn-go-title" class="btn">Title</button>
  </div>
</section>

<div id="dbg" hidden></div>
<script type="module" src="./dist/main.js"></script>
</body>
</html>
